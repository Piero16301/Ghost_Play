name: ghost_play
description: Listen to voice notes without blue ticks. No last seen, zero traces.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: ">=3.50.0"

dependencies:
  bloc: ^9.2.1
  country_flags: ^4.1.2
  equatable: ^3.0.0
  expressive_kit: ^0.0.9
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_performance: ^0.12.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  gal: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  hugeicons: ^4.4.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  saf: ^2.1.2
  shared_preferences: ^2.5.6
  video_player: ^2.14.1

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.25
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
  video_player_platform_interface: ^6.9.0

flutter_launcher_icons:
  android: true
  image_path_android: "assets/images/app-main-logo-rounded.png"
  adaptive_icon_background: "#0F1B33"
  adaptive_icon_foreground: "assets/images/app-main-logo-rounded.png"
  ios: true
  image_path_ios: "assets/images/app-main-logo-rounded.png"
  remove_alpha_ios: true
  background_color_ios: "#0F1B33"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
